name: Build Demo

on:
  schedule:
    - cron: '0 6 * * *' # daily
  workflow_dispatch:

jobs:
  build-windows:
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit

  build-linux:
    uses: ./.github/workflows/build-linux.yml
    secrets: inherit

  build-macos:
    uses: ./.github/workflows/build-macos.yml
    secrets: inherit

  build-android:
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

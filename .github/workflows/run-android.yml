name: Run Demo (Android)

on:
  workflow_call:
    inputs:
      build-branch:
        description: 'Branch to run the latest successful build from (default: main)'
        type: string
        default: ''

jobs:
  run:
    name: Run Demo (Android)
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: us-west-1
      SAUCE_DEVICE_NAME: Samsung_Galaxy_S23_15_real_sjc1
      SAUCE_SESSION_NAME: SentryTower Android Demo Run

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out app-runner
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: getsentry/app-runner
          ref: aeae6e15b97ce37acac0d55ff48199c842d2a075
          path: app-runner

      - name: Get latest build run
        id: get-run
        env:
          BUILD_BRANCH: ${{ inputs.build-branch || 'main' }}
        shell: pwsh
        run: |
          $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=success&per_page=1&branch=$([uri]::EscapeDataString($env:BUILD_BRANCH))" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $runId = $runs.workflow_runs[0].id
          if (-not $runId) { throw "No successful build found on $env:BUILD_BRANCH" }
          echo "run-id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download SentryTower
        id: download
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SentryTower-Android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-run.outputs.run-id }}

      - name: Run on SauceLabs
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/scripts/run-demo-android.ps1 -ApkDir "${{ steps.download.outputs.download-path }}"

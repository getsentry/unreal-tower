name: Update dependencies

on:
  schedule:
    - cron: '0 3 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write      # To push the update branch
  pull-requests: write # To create and update pull requests
  actions: write       # To cancel previous runs of this workflow

jobs:
  sentry-unreal:
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/updater@36529d71129a14967bea1fb81bcaf2a5943cf877 # 3.5.0
        with:
          path: sentry-unreal.properties
          name: Sentry Unreal SDK
          pattern: '^\d+\.\d+\.\d+$' # releases only, no pre-releases
          changelog-entry: false
          api-token: ${{ secrets.GITHUB_TOKEN }}

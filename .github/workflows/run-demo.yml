name: run-demo

on:
  schedule: # Run every 50 minutes
    - cron: '*/50 * * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: run-demo
  cancel-in-progress: false

jobs:
  run-windows:
    name: Run Demo (Windows)
    runs-on: windows-latest

    steps:
      - name: Get latest build run
        id: get-run
        run: |
          $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-demo.yml/runs?status=success&per_page=1" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $runId = $runs.workflow_runs[0].id
          echo "run-id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download SentryTower
        id: download
        uses: actions/download-artifact@v4
        with:
          name: SentryTower
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-run.outputs.run-id }}

      - name: Run Simulation
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          $downloadPath = "${{ steps.download.outputs.download-path }}"
          Write-Output "Download path: $downloadPath"

          # List files in download path
          Write-Output "Files in download path:"
          Get-ChildItem $downloadPath

          $exePath = Join-Path $downloadPath "SentryTower.exe"
          if (!(Test-Path $exePath)) {
            Write-Error "SentryTower.exe not found at: $exePath"
            exit 1
          }

          # Start a dummy spectator client in the background to emulate multiplayer setup required for network traffic generation
          Write-Output "Starting spectator client..."
          $client = Start-Process -FilePath $exePath -ArgumentList "-Unattended", "-nullrhi", "127.0.0.1:7777" -PassThru -WindowStyle Hidden

          # Run game as a listen server to which the spectator client can connect
          Write-Output "Running: $exePath -Unattended -nullrhi --idle"
          $server = Start-Process -FilePath $exePath -ArgumentList "-Unattended", "-nullrhi", "--idle", "/Game/Maps/Main?listen", "-port=7777" -Wait -PassThru -NoNewWindow
          $exitCode = $server.ExitCode
          Write-Output "Process completed. Exit code: $exitCode"

          if (!$client.HasExited) {
            Write-Output "Stopping spectator client..."
            Stop-Process -Id $client.Id -Force -ErrorAction SilentlyContinue
          }

          if ($exitCode -eq 0) {
            Write-Error "Expected non-zero exit code but got 0"
            exit 1
          }
          Write-Output "Simulation completed with expected non-zero exit code: $exitCode"

  run-linux:
    name: Run Demo (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Get latest build run
        id: get-run
        shell: pwsh
        run: |
          $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-demo.yml/runs?status=success&per_page=1" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $runId = $runs.workflow_runs[0].id
          echo "run-id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download SentryTower
        id: download
        uses: actions/download-artifact@v4
        with:
          name: SentryTower-Linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-run.outputs.run-id }}

      - name: Run Simulation
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          DL="${{ steps.download.outputs.download-path }}"
          echo "Download path: $DL"
          ls "$DL"

          if [ ! -f "$DL/SentryTower.sh" ]; then
            echo "::error::SentryTower.sh not found at: $DL"
            exit 1
          fi

          # Artifacts don't preserve the executable bit
          chmod -R +x "$DL"

          # Start a dummy spectator client in the background to emulate multiplayer setup required for network traffic generation
          echo "Starting spectator client..."
          "$DL/SentryTower.sh" -Unattended -nullrhi 127.0.0.1:7777 &
          CLIENT_PID=$!

          # Run game as a listen server to which the spectator client can connect
          echo "Running: SentryTower.sh -Unattended -nullrhi --idle"
          set +e
          "$DL/SentryTower.sh" -Unattended -nullrhi --idle "/Game/Maps/Main?listen" -port=7777
          EXIT_CODE=$?
          set -e
          echo "Process completed. Exit code: $EXIT_CODE"

          kill $CLIENT_PID 2>/dev/null || true

          if [ $EXIT_CODE -eq 0 ]; then
            echo "::error::Expected non-zero exit code but got 0"
            exit 1
          fi
          echo "Simulation completed with expected non-zero exit code: $EXIT_CODE"

  run-android:
    name: Run Demo (Android)
    runs-on: ubuntu-latest

    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      SAUCE_REGION: us-west-1
      SAUCE_DEVICE_NAME: Samsung_Galaxy_S23_15_real_sjc1
      SAUCE_SESSION_NAME: SentryTower Android Demo Run

    steps:
      - uses: actions/checkout@v4

      - name: Check out app-runner
        uses: actions/checkout@v4
        with:
          repository: getsentry/app-runner
          ref: 8be06e220d490e527b810f6d073872025bf491b3
          path: app-runner

      - name: Get latest build run
        id: get-run
        shell: pwsh
        run: |
          $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-demo.yml/runs?status=success&per_page=1" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $runId = $runs.workflow_runs[0].id
          echo "run-id=$runId" >> $env:GITHUB_OUTPUT

      - name: Download SentryTower
        id: download
        uses: actions/download-artifact@v4
        with:
          name: SentryTower-Android
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.get-run.outputs.run-id }}

      - name: Run on SauceLabs
        shell: pwsh
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/scripts/run-demo-android.ps1 -ApkDir "${{ steps.download.outputs.download-path }}"
